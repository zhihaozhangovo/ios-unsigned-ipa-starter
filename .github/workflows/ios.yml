name: Build iPadAgent unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build iPadAgent for iPadOS without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project iPadAgent.xcodeproj \
            -scheme iPadAgent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/iPadAgent.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/iPadAgent-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/iPadAgent.app
          (cd build && /usr/bin/zip -qry iPadAgent-unsigned.ipa Payload)
          /usr/bin/unzip -t build/iPadAgent-unsigned.ipa
          /usr/bin/unzip -l build/iPadAgent-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iPadAgent-unsigned-ipa
          path: build/iPadAgent-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
