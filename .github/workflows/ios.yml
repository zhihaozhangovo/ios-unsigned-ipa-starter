name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iPhoneOS without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project IPAStarter.xcodeproj \
            -scheme IPAStarter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/IPAStarter.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/IPAStarter.app
          (cd build && /usr/bin/zip -qry IPA-Starter-unsigned.ipa Payload)
          unzip -l build/IPA-Starter-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/IPA-Starter-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
